controller:
  labels:
    project: diploma-demo
podLabels:
  project: diploma-demo
  app/logs_json: "true"
image:
  pullPolicy: IfNotPresent
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
service:
  main:
    enabled: true
    ports:
      http:
        enabled: true
        port: 80
        targetPort: 8080
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
