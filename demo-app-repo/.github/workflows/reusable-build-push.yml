name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      registry:
        required: true
        type: string
      push:
        required: true
        type: boolean
      tag_prefix:
        required: true
        type: string
    outputs:
      image_repository:
        value: ${{ jobs.docker.outputs.image_repository }}
      image_tag:
        value: ${{ jobs.docker.outputs.image_tag }}

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${{ inputs.tag_prefix }}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          IMAGE_REPOSITORY="${{ inputs.registry }}/${{ inputs.image_name }}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Azure login with OIDC
        if: inputs.push
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: inputs.push
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.image_repository }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_repository }}:${{ inputs.tag_prefix }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
