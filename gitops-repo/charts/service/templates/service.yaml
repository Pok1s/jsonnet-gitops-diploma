{{- if .Values.service.main.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.service.main.ports.http.enabled }}
    - name: http
      port: {{ .Values.service.main.ports.http.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
{{- end }}

